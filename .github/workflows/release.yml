name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows installer
            os: windows-2022
            command: npm run build:win
            artifact-name: TTime-windows-installer
            artifact-path: |
              dist/*-setup.exe
          - name: Windows portable
            os: windows-2022
            command: npm run build:win:portable
            artifact-name: TTime-windows-portable
            artifact-path: |
              dist/*-portable.zip
          - name: macOS
            os: macos-13
            command: npm run build:mac
            artifact-name: TTime-macos
            artifact-path: |
              dist/*.dmg
              dist/*.zip
              dist/*.blockmap
          - name: Linux
            os: ubuntu-22.04
            command: npm run build:linux:ci
            artifact-name: TTime-linux
            artifact-path: |
              dist/*.AppImage
              dist/*.deb
              dist/*.yml

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build artifacts
        run: ${{ matrix.command }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: release-artifacts/*
